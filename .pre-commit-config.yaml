repos:
  # Blocks staged secrets before they reach a commit. CI's gitleaks job is
  # the backstop for clones without the hooks installed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # ruff, mypy and import-linter run from the Poetry environment, so the
      # hooks and CI always use the versions in poetry.lock. They check the
      # same scope as CI; this repo is small enough that the whole scope
      # costs no more than the staged files.
      - id: ruff
        name: ruff check --fix
        entry: poetry run ruff check --fix src tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format src tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false

      - id: import-linter
        name: import-linter (bridge layering)
        entry: poetry run lint-imports
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false

      # The test suite runs in CI (.github/workflows/ci.yml), not as a
      # pre-commit hook.

      # Comments and docstrings must stand alone, without labels that
      # point into local planning documents. Genuine hits go into
      # scripts/plan_refs_allowlist.txt.
      - id: plan-refs
        name: no planning labels in comments
        entry: python3 scripts/check_plan_refs.py
        language: system
        files: ^(src/|tests/|scripts/|docs/|docker/|\.github/|pyproject\.toml$|docker-compose(\.build)?\.yml$|README\.md$|\.pre-commit-config\.yaml$)
