[project]
authors = [
  {name = "Philip Delorenzo", email = "git@deloarts.com"},
]
description = "Glados Terminal"
license = "LicenseRef-DAL-1.0.0"
name = "glados-terminal"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.13"

# Web framework
fastapi = "^0.141"
uvicorn = {version = "^0.34", extras = ["standard"]}

# Validation & settings
pydantic = "^2.10"
pydantic-settings = "^2.7"

# Device identity (Ed25519 key pair, src/identity/store.py)
cryptography = "^50.0.2"

# Hardware drivers (optional group, see [tool.poetry.group.hardware] below).
# evdev only ships usable wheels on Linux; pyserial-asyncio is the asyncio
# serial reader for the barcode/QR scanner. Neither is needed to import
# src.devices.rfid_evdev / src.devices.scanner_serial -- both guard their
# import and raise only when that device type is actually enabled in
# config (see src/infrastructure/config.py and the `architecture` skill).
[tool.poetry.group.hardware.dependencies]
evdev = "^1.7"
pyserial-asyncio = "^0.6"

[tool.poetry.group.hardware]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = "^1.14"
pre-commit = "^3.8.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.3"
ruff = "^0.9"
pytest-cov = "^7.1.0"
httpx = "^0.28"
import-linter = "^2.15"
pip-audit = "2.10.1"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
force-single-line = true
split-on-trailing-comma = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Header",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Checked by CI's pytest step (--cov=src). rfid_evdev.py, scanner_serial.py
# and src/main.py have no tests that run without hardware, which keeps the
# total well below 100.
[tool.coverage.report]
fail_under = 75

# The layering from CLAUDE.md. src.main is the composition root and may
# import everything; src.infrastructure is imported from anywhere.
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Layers: api -> devices -> events"
type = "layers"
layers = [
  "src.api",
  "src.devices",
  "src.events",
]

[[tool.importlinter.contracts]]
name = "Identity depends on infrastructure only"
type = "forbidden"
source_modules = ["src.identity"]
forbidden_modules = ["src.api", "src.devices", "src.events", "src.main"]

[[tool.importlinter.contracts]]
name = "Only the api uses the identity store"
type = "forbidden"
source_modules = ["src.devices", "src.events"]
forbidden_modules = ["src.identity"]

[[tool.importlinter.contracts]]
name = "Host depends on infrastructure only"
type = "forbidden"
source_modules = ["src.host"]
forbidden_modules = ["src.api", "src.devices", "src.events", "src.identity", "src.main"]

[[tool.importlinter.contracts]]
name = "Only the api uses the host readers and display control"
type = "forbidden"
source_modules = ["src.devices", "src.events", "src.identity"]
forbidden_modules = ["src.host"]

[[tool.importlinter.contracts]]
name = "Infrastructure depends on no other layer"
type = "forbidden"
source_modules = ["src.infrastructure"]
forbidden_modules = ["src.api", "src.devices", "src.events", "src.host", "src.identity", "src.main"]
