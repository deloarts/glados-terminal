# ─── sway config for the kiosk container ───────────────────
# sway hosts exactly one app, Chromium, fullscreen. There is no bar and
# there are no key bindings, so a keyboard at the device cannot open
# anything else or leave the kiosk. XWayland is off; Chromium talks
# Wayland directly.
#
# The display settings come from the KIOSK_OUTPUT_* variables in .env:
# docker/kiosk-entrypoint.sh writes them to output.conf at every
# container start, included below. Changing them means editing .env and
# `docker compose up -d kiosk`, never rebuilding the image.
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 3000

for_window [app_id="^chromium"] fullscreen enable

include /etc/glados-kiosk/output.conf

exec /usr/local/bin/kiosk-chromium
